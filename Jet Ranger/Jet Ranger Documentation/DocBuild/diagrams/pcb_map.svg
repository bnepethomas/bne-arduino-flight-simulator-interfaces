<text x="468.0" y="214.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger Upper Controller</text>
<text x="468.0" y="237.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: Upper controller (.103)</text>
<text x="468.0" y="255.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">key matrix; J17 WARNING MUTE on D30</text>
<text x="468.0" y="272.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">(not read by the current sketch)</text>
