<text x="28.0" y="354.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger 13 Stepper</text>
<text x="28.0" y="377.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: Stepper controller (.105)</text>
<text x="28.0" y="395.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">BACKLIGHT_PWM D5, VSI coil B D8</text>
<text x="28.0" y="412.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">D2 net renamed STEPPER_FA_A</text>
<rect x="456.0" y="330.0" width="408.0" height="120.0" rx="10" ry="10" fill="#FFF3DC" stroke="#C77700" stroke-width="1.2"/>
<text x="468.0" y="354.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger OLED Dual Stepper</text>
<text x="468.0" y="377.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: Dual stepper controller (.106)</text>
<text x="468.0" y="395.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">v1.4 removes the D2 / D32 short</text>
<text x="468.0" y="412.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">BACKLIGHT_PWM D5</text>
<text x="16.0" y="512.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Boards older than v1.4 of the Dual Stepper PCB: fit only one of fuel quantity and fuel load, or cut the trace.</text>
<text x="16.0" y="534.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Check every pin against the sketch pin table and the KiCad files before ordering or wiring a new board.</text>
