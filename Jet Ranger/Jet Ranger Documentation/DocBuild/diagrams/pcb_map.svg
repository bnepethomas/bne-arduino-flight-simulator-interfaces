<text x="16.0" y="24.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F1F1F" text-anchor="start">Active PCBs, their revision and the sketches they belong to</text>
<rect x="16.0" y="50.0" width="408.0" height="120.0" rx="10" ry="10" fill="#E8F0FB" stroke="#2F6FEB" stroke-width="1.2"/>
<text x="28.0" y="74.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger Radio Auto Pilot  v1.3</text>
<text x="28.0" y="97.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: Radio controller (.101)</text>
<text x="28.0" y="115.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">autopilot knobs, volume pots, MAX7219 display</text>
<text x="28.0" y="132.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">lines; backlight MOSFET on D5</text>
<rect x="456.0" y="50.0" width="408.0" height="120.0" rx="10" ry="10" fill="#E8F0FB" stroke="#2F6FEB" stroke-width="1.2"/>
<text x="468.0" y="74.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger COM and NAV</text>
<text x="468.0" y="97.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: Radio controller (.101)</text>
<text x="468.0" y="115.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">four swap switches in a diode matrix:</text>
<text x="468.0" y="132.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">column D26, rows D22-D25</text>
<rect x="16.0" y="190.0" width="408.0" height="120.0" rx="10" ry="10" fill="#E7F4EA" stroke="#2E7D32" stroke-width="1.2"/>
<text x="28.0" y="214.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger Front Panel Servo  v1.4</text>
<text x="28.0" y="237.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: Servo controller (.102)</text>
<text x="28.0" y="255.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">switches D43, D47, D48; backlight D5</text>
<text x="28.0" y="272.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">MOSFET pin-out corrected in 1.4</text>
<rect x="456.0" y="190.0" width="408.0" height="120.0" rx="10" ry="10" fill="#F0EAFB" stroke="#6A3FC7" stroke-width="1.2"/>
<text x="468.0" y="214.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger Upper Controller  v1.4</text>
<text x="468.0" y="237.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: Upper controller (.103)</text>
<text x="468.0" y="255.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">key matrix, brightness pot on A0,</text>
<text x="468.0" y="272.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">backlight MOSFET on D5</text>
<rect x="16.0" y="330.0" width="408.0" height="120.0" rx="10" ry="10" fill="#FFF3DC" stroke="#C77700" stroke-width="1.2"/>
<text x="28.0" y="354.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger 13 Stepper  v1.6</text>
<text x="28.0" y="377.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: Stepper controller (.105)</text>
<text x="28.0" y="395.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">backlight D5, VSI coil B D8</text>
<text x="28.0" y="412.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">IRF540N backlight MOSFET</text>
<rect x="456.0" y="330.0" width="408.0" height="120.0" rx="10" ry="10" fill="#FFF3DC" stroke="#C77700" stroke-width="1.2"/>
<text x="468.0" y="354.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger OLED Dual Stepper  v1.5</text>
<text x="468.0" y="377.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: Dual stepper controller (.106)</text>
<text x="468.0" y="395.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">D2 / D32 short removed in 1.4</text>
<text x="468.0" y="412.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">IRF540N backlight MOSFET</text>
<rect x="16.0" y="470.0" width="408.0" height="120.0" rx="10" ry="10" fill="#E3F5F4" stroke="#00796B" stroke-width="1.2"/>
<text x="28.0" y="494.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Jet Ranger ADF Controller  v1.5</text>
<text x="28.0" y="517.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: ADF controller (.107)</text>
<text x="28.0" y="535.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">knobs, keypad, brightness pot, 12 V monitor,</text>
<text x="28.0" y="552.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">gear lamps, anti-ice / hyd boost / caution dim</text>
<rect x="456.0" y="470.0" width="408.0" height="120.0" rx="10" ry="10" fill="#F1F1EE" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="468.0" y="494.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Audio, Auto Pilot and ADF panels  v1.1</text>
<text x="468.0" y="517.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">plugs into: switch panels on the controllers</text>
<text x="468.0" y="535.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">diode-matrix switch boards, LEDs</text>
<text x="468.0" y="552.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">and rotary encoders</text>
<text x="16.0" y="622.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">COM and NAV (radio panel) has no revision set. Dual Stepper boards older than 1.4: fit only one of fuel quantity and fuel load.</text>
<text x="16.0" y="644.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Check every pin against the sketch pin table and the KiCad files before ordering or wiring a new board.</text>
