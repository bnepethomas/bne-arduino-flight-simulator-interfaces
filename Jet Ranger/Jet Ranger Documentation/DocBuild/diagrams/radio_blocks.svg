<text x="28.0" y="487.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">row 0: NAV1_RADIO_SWAP</text>
<text x="28.0" y="504.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">row 1: NAV2_RADIO_SWAP</text>
<text x="28.0" y="521.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">row 2: COM1_RADIO_SWAP</text>
<text x="28.0" y="538.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">row 3: COM2_RADIO_SWAP</text>
<text x="28.0" y="555.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">        + AVIONICS_MASTER_SET</text>
<rect x="614.0" y="380.0" width="250.0" height="200.0" rx="10" ry="10" fill="#FFF3DC" stroke="#C77700" stroke-width="1.2"/>
<text x="626.0" y="404.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="start">Power and blanking</text>
<text x="626.0" y="428.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">COM and NAV OLEDs go dark when</text>
<text x="626.0" y="445.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">the PC sends NAVCOM1:0 (avionics</text>
<text x="626.0" y="463.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">bus below 24 V) or after 30 s with</text>
<text x="626.0" y="480.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">no data and no knob or key use.</text>
<text x="626.0" y="498.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Any knob or key wakes them.</text>
<path d="M 570.0 450.0 L 614.0 450.0" fill="none" stroke="#8A8A85" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah8A8A85)"/>
