<text x="682.0" y="175.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="end">no data for 3 s</text>
<path d="M 770.0 230.0 L 770.0 120.0" fill="none" stroke="#8A8A85" stroke-width="1.6" marker-end="url(#ah8A8A85)"/>
<rect x="776.0" y="164.0" width="86.9" height="16.0" rx="3" ry="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="780.0" y="175.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">data returns</text>
<rect x="30.0" y="230.0" width="240.0" height="90.0" rx="10" ry="10" fill="#F1F1EE" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="150.0" y="251.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">MSFS quits or the link drops</text>
<text x="150.0" y="275.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">from any state</text>
<path d="M 150.0 230.0 L 150.0 120.0" fill="none" stroke="#C62828" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahC62828)"/>
<rect x="156.0" y="164.0" width="80.6" height="16.0" rx="3" ry="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="160.0" y="175.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">start again</text>
<text x="16.0" y="356.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">A new aircraft is picked up while connected: the name in the status bar changes and the estimate models restart.</text>
<text x="16.0" y="378.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">SimConnect errors are caught on every path, so a closed simulator never stops the bridge. FSUIPCWinformsAutoCS behaves the same way with FSUIPC.</text>
</svg>
