<text x="600.0" y="486.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">always off</text>
<text x="16.0" y="534.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">All lamps go out when the main bus is below 20 V. Sent as &lt;token&gt;:1 / &lt;token&gt;:0 in every Servo packet.</text>
<text x="16.0" y="554.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The lamp test at power-up lights all 15; a no-data timeout turns them all off.</text>
