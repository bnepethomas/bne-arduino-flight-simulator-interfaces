<text x="16.0" y="26.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F1F1F" text-anchor="start">The 15 warning lamps on the Servo board</text>
<text x="16.0" y="46.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Green: the bridge drives it from the simulator. Grey: needs aircraft-specific variables, so it stays off.</text>
<rect x="16.0" y="70.0" width="276.0" height="78.0" rx="10" ry="10" fill="#E7F4EA" stroke="#2E7D32" stroke-width="1.2"/>
<text x="28.0" y="93.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1F1F1F" text-anchor="start">ENGINE OUT</text>
<text x="28.0" y="117.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">pin A1   token EOUT</text>
<text x="28.0" y="134.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">engine speed &lt; 60 %</text>
<rect x="302.0" y="70.0" width="276.0" height="78.0" rx="10" ry="10" fill="#E7F4EA" stroke="#2E7D32" stroke-width="1.2"/>
