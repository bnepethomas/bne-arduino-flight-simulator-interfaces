<text x="16.0" y="620.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The ATX supply PCB feeds the power distribution PCB with its own 12 V and 5 V cables.</text>
<text x="16.0" y="638.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The GPS, the 12 V lighting module, the network switch and the USB hub each have a separate cable of their own.</text>
<text x="16.0" y="656.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The USB hub is powered directly, not through the power distribution PCB. Each cable is one line; ground returns are not drawn.</text>
