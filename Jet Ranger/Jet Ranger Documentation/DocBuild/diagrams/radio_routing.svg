<path d="M 434.0 496.0 L 472.0 496.0" fill="none" stroke="#2F6FEB" stroke-width="1.6" marker-end="url(#ah2F6FEB)"/>
<path d="M 662.0 496.0 L 700.0 496.0" fill="none" stroke="#8A8A85" stroke-width="1.6" marker-end="url(#ah8A8A85)"/>
<text x="16.0" y="570.0" font-family="Liberation Mono, Consolas, Courier New, monospace" font-size="12.5" font-weight="400" fill="#1F1F1F" text-anchor="start">D,C1A:128.300,C1S:127.800,C2A:118.000,C2S:121.500,MAINBUS:28.0,NAVCOM1:1</text>
<text x="16.0" y="594.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Tuning steps: COM 25 kHz channels 118.000 - 136.975 MHz; NAV 50 kHz steps 108.00 - 117.95 MHz.</text>
<text x="16.0" y="616.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The minor knob wraps within the same MHz; the major knob stops at the ends.</text>
