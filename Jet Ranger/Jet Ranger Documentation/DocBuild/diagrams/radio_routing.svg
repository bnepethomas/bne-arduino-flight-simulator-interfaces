<text x="216.0" y="163.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1F1F1F" text-anchor="start">What the radio sends on 27001</text>
<text x="216.0" y="187.0" font-family="Liberation Mono, Consolas, Courier New, monospace" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">COM1   118.295                (a bare number)</text>
<text x="216.0" y="204.5" font-family="Liberation Mono, Consolas, Courier New, monospace" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">COM2   COM2_STANDBY:118.295</text>
<text x="216.0" y="222.0" font-family="Liberation Mono, Consolas, Courier New, monospace" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">NAV1   NAV1_STANDBY:108.000</text>
<text x="216.0" y="239.5" font-family="Liberation Mono, Consolas, Courier New, monospace" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">NAV2   NAV2_STANDBY:108.000</text>
<text x="16.0" y="286.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F1F1F" text-anchor="start">Swap key: radio board to simulator</text>
<rect x="16.0" y="300.0" width="150.0" height="74.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="91.0" y="323.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F1F1F" text-anchor="middle">Swap key</text>
<text x="91.0" y="347.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">column 0</text>
<rect x="204.0" y="300.0" width="230.0" height="74.0" rx="10" ry="10" fill="#F1F1EE" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="319.0" y="323.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F1F1F" text-anchor="middle">Radio board</text>
<text x="319.0" y="347.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">sends the swap command</text>
<text x="319.0" y="365.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">to UDP 27001</text>
<rect x="472.0" y="300.0" width="190.0" height="74.0" rx="10" ry="10" fill="#E8F0FB" stroke="#2F6FEB" stroke-width="1.2"/>
<text x="567.0" y="323.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F1F1F" text-anchor="middle">Bridge</text>
<text x="567.0" y="347.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">swap event</text>
<rect x="700.0" y="300.0" width="164.0" height="74.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="782.0" y="323.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1F1F1F" text-anchor="middle">Simulator</text>
<text x="782.0" y="347.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">swaps active /</text>
<text x="782.0" y="365.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">standby</text>
