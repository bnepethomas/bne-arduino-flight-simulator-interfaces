<text x="16.0" y="470.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Then the 15 warning lamps are switched off one by one. OLEDs ON / OFF light the Dual Stepper's displays for the run.</text>
<text x="16.0" y="492.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The boards do not report when a swing ends, so each row has a wait; a full pass takes about 220 s plus the lamps.</text>
<text x="16.0" y="514.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">A keep-alive command every 10 s stops the boards' 30 s no-data timers from firing during the run.</text>
