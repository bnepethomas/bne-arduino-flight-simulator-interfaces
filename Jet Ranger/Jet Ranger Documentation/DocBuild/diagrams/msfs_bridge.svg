<rect x="16.0" y="170.0" width="848.0" height="94.0" rx="10" ry="10" fill="#E8F0FB" stroke="#2F6FEB" stroke-width="1.2"/>
<text x="28.0" y="194.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">ToSnapshot(): one SimSnapshot in real units</text>
<text x="28.0" y="217.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">standard SimVars, with aircraft profiles on top: FlyInside B206 (L:vars and estimates), CowaSim Jet Ranger</text>
<text x="28.0" y="235.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">(smoothed torque, EGT based turbine temperature, load scale), see the aircraft profile figure</text>
<path d="M 440.0 264.0 L 440.0 300.0" fill="none" stroke="#8A8A85" stroke-width="1.6" marker-end="url(#ah8A8A85)"/>
<rect x="16.0" y="300.0" width="848.0" height="78.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="28.0" y="324.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Payloads.cs: pure packet builders (no SimConnect or window code)</text>
<text x="28.0" y="347.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Servo, Stepper, Dual Stepper, OLED, Radio packets; lamp rules; power rules (20 V, 24 V)</text>
<path d="M 440.0 378.0 L 440.0 410.0" fill="none" stroke="#2F6FEB" stroke-width="1.6" marker-end="url(#ah2F6FEB)"/>
<rect x="458.4" y="385.0" width="199.2" height="16.0" rx="3" ry="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="558.0" y="396.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">UDP 13136, about 10 per second</text>
<rect x="16.0" y="410.0" width="848.0" height="54.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="28.0" y="434.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Five UDP clients</text>
<text x="28.0" y="457.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Radio .101   Servo .102   OLED .104   Stepper .105   Dual Stepper .106</text>
<rect x="16.0" y="490.0" width="280.0" height="94.0" rx="10" ry="10" fill="#F1F1EE" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="28.0" y="514.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">timerConnection  (1 s)</text>
<text x="28.0" y="537.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">new SimConnect(...) until MSFS</text>
<text x="28.0" y="554.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">is found; on quit or a lost</text>
<text x="28.0" y="571.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">connection it starts again</text>
<rect x="320.0" y="490.0" width="270.0" height="94.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="332.0" y="514.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">DefWndProc</text>
<text x="332.0" y="537.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">WM_USER_SIMCONNECT -&gt;</text>
<text x="332.0" y="554.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">ReceiveMessage(); data callback</text>
<text x="332.0" y="571.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">only stores the sample</text>
<rect x="614.0" y="490.0" width="250.0" height="94.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="626.0" y="514.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">UDP 27001 listener</text>
<text x="626.0" y="537.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">UpdateRadios(): swaps, standby,</text>
<text x="626.0" y="554.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">avionics, battery, alternator</text>
<text x="626.0" y="571.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">-&gt; TransmitClientEvent</text>
<text x="16.0" y="614.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">No new data for 3 s (paused or loading): the bridge stops sending and the boards' 30 s watchdogs zero the gauges.</text>
<text x="16.0" y="636.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Run only one bridge at a time: FSUIPCWinformsAutoCS and MSFSWinformsAutoCS both listen on UDP 27001.</text>
</svg>
