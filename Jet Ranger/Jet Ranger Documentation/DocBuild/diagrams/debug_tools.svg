<text x="602.0" y="85.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">forward</text>
<rect x="16.0" y="210.0" width="270.0" height="110.0" rx="10" ry="10" fill="#F1F1EE" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="28.0" y="234.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Health Monitor</text>
<text x="28.0" y="257.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">listens on 13137</text>
<text x="28.0" y="275.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">one light per board</text>
<rect x="320.0" y="210.0" width="270.0" height="110.0" rx="10" ry="10" fill="#F1F1EE" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="332.0" y="234.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">SwingTester</text>
<text x="332.0" y="257.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">swings every gauge and</text>
<text x="332.0" y="275.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">lamp from the PC, uses</text>
<text x="332.0" y="292.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">ports 13136 and 4210</text>
<rect x="624.0" y="210.0" width="240.0" height="110.0" rx="10" ry="10" fill="#F1F1EE" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="636.0" y="234.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">StepperVSITester</text>
<text x="636.0" y="257.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">VSI test sweep,</text>
<text x="636.0" y="275.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">sent to the Stepper</text>
<text x="16.0" y="360.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Only one program can own a UDP port. If the reflector is running, do not start a second listener on 27000 - use its forwarding instead.</text>
<text x="16.0" y="382.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The bridges listen on 27001 and the HID board on 4210, so run only one bridge and one HID sender at a time.</text>
</svg>
