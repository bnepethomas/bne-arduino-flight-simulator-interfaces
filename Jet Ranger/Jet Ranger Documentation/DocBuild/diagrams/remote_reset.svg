<text x="28.0" y="408.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The HID board drops its USB joysticks while it restarts. A board that loops after a reset needs a power cycle.</text>
