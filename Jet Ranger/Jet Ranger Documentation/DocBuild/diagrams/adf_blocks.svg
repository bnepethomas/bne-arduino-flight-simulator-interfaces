<text x="626.0" y="319.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">D31-D37 to the bridge (27001):</text>
<text x="626.0" y="337.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">GEAR_SET, FLAPS_SET,</text>
<text x="626.0" y="354.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">SPOILERS_SET, ANTI_ICE_SET (1/0)</text>
<text x="626.0" y="372.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">buttons 104-107, 112-114 to HID</text>
<path d="M 580.0 300.0 L 614.0 330.0" fill="none" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#ah2E7D32)"/>
<rect x="614.0" y="418.0" width="250.0" height="100.0" rx="10" ry="10" fill="#FFF3DC" stroke="#C77700" stroke-width="1.2"/>
<text x="626.0" y="441.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1F1F1F" text-anchor="start">Upper panel to the HID board</text>
<text x="626.0" y="465.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">UDP 4210: "&lt;index&gt;,&lt;state&gt;" (0 - 95)</text>
<text x="626.0" y="482.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">keypad: "KEY,&lt;key&gt;,&lt;state&gt;"</text>
<text x="626.0" y="500.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">heartbeats ADF_PANEL + UPPER_INPUT</text>
