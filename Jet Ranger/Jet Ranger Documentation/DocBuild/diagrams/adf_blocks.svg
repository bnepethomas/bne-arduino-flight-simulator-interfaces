<text x="28.0" y="577.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">12 V: A8, 47k / 10k divider</text>
<text x="28.0" y="595.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">5 V: AVcc against the 1.1 V</text>
