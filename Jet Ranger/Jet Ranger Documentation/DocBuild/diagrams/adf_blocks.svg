<rect x="614.0" y="534.0" width="250.0" height="100.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="626.0" y="558.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Own backlight and lamps</text>
<text x="626.0" y="581.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">D5 PWM: BPWR, C,B, 30 s no-data;</text>
<text x="626.0" y="599.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">OLED and lamps D2 - D4 blank with</text>
<text x="626.0" y="616.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">the Radio displays (C,DISPLAY)</text>
<path d="M 580.0 350.0 L 614.0 570.0" fill="none" stroke="#8A8A85" stroke-width="1.6" marker-end="url(#ah8A8A85)"/>
<rect x="300.0" y="420.0" width="280.0" height="100.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C9C9C4" stroke-width="1.2"/>
<text x="440.0" y="442.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="middle">UDP 13136 in</text>
<text x="440.0" y="465.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">C,RESET:1  C,MATRIX:1  C,POWER:1</text>
<text x="440.0" y="483.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">C,B:0-15  C,DISPLAY:0/1  C,KEEPALIVE:1</text>
<text x="440.0" y="500.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">D,LDGN/LDGL/LDGR (lamps), D,BPWR:1/0</text>
<path d="M 440.0 420.0 L 440.0 360.0" fill="none" stroke="#2F6FEB" stroke-width="1.6" marker-end="url(#ah2F6FEB)"/>
<text x="16.0" y="668.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The toggle switches send their position as a value (every change and every 5 s); the brakes push button sends PARKING_BRAKES.</text>
<text x="16.0" y="688.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The Upper panel (switch matrix and keypad) was the separate Upper controller, 172.16.1.103, until it was merged into this sketch.</text>
