<text x="28.0" y="169.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">rows A7 - A4, columns A3 - A1</text>
<text x="28.0" y="187.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">0 - 9 type the aircraft ID</text>
<text x="28.0" y="204.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start"># sends it, * deletes a digit</text>
