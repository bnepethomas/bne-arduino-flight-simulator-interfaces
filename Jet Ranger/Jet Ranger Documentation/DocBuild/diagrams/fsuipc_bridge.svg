<text x="28.0" y="223.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">0x02BC airspeed    0x02C8 vertical speed</text>
<text x="28.0" y="240.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">0x3324 altitude    0x31E4 radar altitude</text>
<text x="28.0" y="257.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">0x2F70 / 0x2F78 pitch / bank</text>
<text x="28.0" y="274.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">0x2840 / 0x2850 main / avionics bus volts</text>
<text x="28.0" y="291.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">0x2F28 annunciator bits</text>
<text x="28.0" y="308.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">0x0238 / 0x0239 Zulu time, 0x0E8C air temp</text>
<text x="28.0" y="325.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">radio stack: COM, NAV standby frequencies</text>
