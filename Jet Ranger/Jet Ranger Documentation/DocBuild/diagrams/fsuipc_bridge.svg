<text x="432.0" y="200.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="start">Payload builders</text>
<text x="432.0" y="223.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Servo      D,PITCH,BANK + 15 lamp codes</text>
<text x="432.0" y="240.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Stepper    D,IAS,VSI,AGL,FUEL,TQ,ITT,N1</text>
<text x="432.0" y="257.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Dual       D,PWR,ALT,RPMR,RPME,ZULU,OILT,OILP,</text>
<text x="432.0" y="274.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">                  XMSNT,XMSNP,FUELLOAD,ELECTRICALLOAD,TEMP</text>
<text x="432.0" y="291.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">OLED       D,ALT,BARO</text>
<text x="432.0" y="308.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Radio      D,C1A,C1S,C2A,C2S,MAINBUS,NAVCOM1</text>
